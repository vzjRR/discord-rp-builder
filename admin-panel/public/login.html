<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل الدخول — Enclave Admin</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-32.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#08050c">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img src="/icons/icon-192.png" alt="Enclave RP">
      <h1>لوحة إدارة Enclave RP</h1>
      <p class="subtitle">أدخل الرقم السري الخاص فيك</p>
      <form id="loginForm">
        <input type="password" inputmode="numeric" autocomplete="off" class="pin-input" id="pin"
               placeholder="••••••" maxlength="32" autofocus required>
        <button type="submit" class="btn" style="width:100%">دخول</button>
        <div class="msg" id="msg"></div>
      </form>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pin = document.getElementById('pin').value.trim();
      const msg = document.getElementById('msg');
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'فشل الدخول');
        window.location.href = '/';
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'msg show err';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
