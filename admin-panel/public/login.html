<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>(function(){try{if(localStorage.getItem('enclave_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<script src="/js/theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل الدخول — Enclave RP BOT</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-32.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#f5f2fb">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="theme-toggle-fixed" data-theme-toggle-mount></div>
  <div class="login-wrap">
    <div class="login-card">
      <div id="langSwitch"></div>
      <img src="/icons/icon-192.png" alt="Enclave RP">
      <h1 data-i18n="login.title">Enclave RP BOT</h1>
      <p class="subtitle">سجّل دخولك بحساب ديسكورد الخاص بك بالسيرفر</p>
      <div class="msg" id="oauthMsg"></div>
      <a href="/api/auth/discord/start" class="btn btn-discord" style="width:100%">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M20.3 5.4A19.8 19.8 0 0 0 15.4 4c-.2.4-.5 1-.7 1.4a18 18 0 0 0-5.4 0A11 11 0 0 0 8.6 4a19.7 19.7 0 0 0-4.9 1.5C1 10 .3 14.6.6 19a20 20 0 0 0 6 3c.5-.7.9-1.4 1.3-2.2-.7-.3-1.4-.6-2-1l.5-.4a14.2 14.2 0 0 0 11.9 0l.5.4c-.6.4-1.3.7-2 1 .4.8.8 1.5 1.3 2.2a20 20 0 0 0 6-3c.4-5-.9-9.6-3.8-13.6ZM8.7 15.9c-1 0-1.9-1-1.9-2.1s.8-2.1 1.9-2.1 1.9 1 1.9 2.1-.8 2.1-1.9 2.1Zm6.6 0c-1 0-1.9-1-1.9-2.1s.8-2.1 1.9-2.1 1.9 1 1.9 2.1-.8 2.1-1.9 2.1Z"/></svg>
        الدخول عبر ديسكورد
      </a>

      <details style="margin-top:22px;text-align:right">
        <summary style="cursor:pointer;color:var(--text-dim);font-size:12.5px;text-align:center;list-style:none">
          حساب قديم؟ <span style="color:var(--purple-600);text-decoration:underline">ادخل برقمك السري</span>
        </summary>
        <form id="loginForm" style="margin-top:14px">
          <input type="password" inputmode="numeric" autocomplete="off" class="pin-input" id="pin"
                 placeholder="••••••" maxlength="32">
          <button type="submit" class="btn" style="width:100%" data-i18n="login.submit">دخول</button>
          <div class="msg" id="msg"></div>
        </form>
        <p class="subtitle" style="margin-top:14px">
          <a href="/forgot-pin" data-i18n="login.forgot">نسيت رقمي السري</a>
        </p>
      </details>

      <p class="subtitle" style="margin-top:18px">
        <span data-i18n="login.noCode">ما عندك حساب؟</span>
        <a href="/request-access" data-i18n="login.requestCode">اطلب صلاحية دخول</a>
      </p>
      <p class="subtitle" style="margin-top:6px">
        <a href="/install" data-i18n="login.install">📱 كيف تثبّت المنصة على جهازك</a>
      </p>
      <div class="footer-credit">تم التطوير عن طريق <a href="https://www.tsh87.com" target="_blank" rel="noopener"><b>vzjRR</b></a></div>
    </div>
  </div>
  <script src="/js/i18n.js"></script>
  <script>
    const oauthError = new URLSearchParams(location.search).get('oauthError');
    if (oauthError) {
      const el = document.getElementById('oauthMsg');
      el.textContent = oauthError;
      el.className = 'msg show err';
      history.replaceState(null, '', '/login');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pin = document.getElementById('pin').value.trim();
      const msg = document.getElementById('msg');
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || t('login.failed'));
        window.location.href = data.admin?.mustChangePin ? '/change-pin' : '/';
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'msg show err';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
