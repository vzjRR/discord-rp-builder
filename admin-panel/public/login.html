<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل الدخول — Enclave Admin</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-32.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#08050c">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div id="langSwitch"></div>
      <img src="/icons/icon-192.png" alt="Enclave RP">
      <h1 data-i18n="login.title">لوحة إدارة Enclave RP</h1>
      <p class="subtitle" data-i18n="login.subtitle">أدخل رقمك السري الخاص</p>
      <form id="loginForm">
        <input type="password" inputmode="numeric" autocomplete="off" class="pin-input" id="pin"
               placeholder="••••••" maxlength="32" autofocus required>
        <button type="submit" class="btn" style="width:100%" data-i18n="login.submit">دخول</button>
        <div class="msg" id="msg"></div>
      </form>
      <p class="subtitle" style="margin-top:18px">
        <a href="/forgot-pin" data-i18n="login.forgot">نسيت رقمي السري</a>
      </p>
      <p class="subtitle" style="margin-top:6px">
        <span data-i18n="login.noCode">ألا تملك رمزًا؟</span>
        <a href="/request-access" data-i18n="login.requestCode">اطلب رمز دخول</a>
      </p>
      <p class="subtitle" style="margin-top:6px">
        <a href="/install" data-i18n="login.install">📱 كيف تثبّت المنصة على جهازك</a>
      </p>
    </div>
  </div>
  <script src="/js/i18n.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pin = document.getElementById('pin').value.trim();
      const msg = document.getElementById('msg');
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || t('login.failed'));
        window.location.href = data.admin?.mustChangePin ? '/change-pin' : '/';
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'msg show err';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
