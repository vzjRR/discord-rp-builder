<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الرسائل والإعلانات — Enclave Admin</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-32.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#08050c">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar">
    <div class="brand"><img src="/icons/icon-192.png" alt=""><span>Enclave Admin</span></div>
    <a class="nav-link" href="/">الرئيسية</a>
    <a class="nav-link" href="/messages">الرسائل والإعلانات</a>
    <a class="nav-link" href="/moderation">الإشراف</a>
    <a class="nav-link" href="/server">إدارة السيرفر</a>
    <a class="nav-link" href="/status">حالة السيرفر</a>
    <a class="nav-link" href="/points">ترتيب نقاط الدعم</a>
    <a class="nav-link" href="/templates">الرسائل الثابتة</a>
    <a class="nav-link" href="/logs">سجل النشاط</a>
    <a class="nav-link" href="/admins">إدارة الحسابات</a>
    <div class="nav-footer">
      <div class="who"></div>
      <button class="logout-btn">تسجيل الخروج</button>
    </div>
  </nav>
  <main class="main">
    <h1>الرسائل والإعلانات</h1>
    <p class="subtitle">رسائل خاصة إلى الأعضاء، أو إعلانات تُنشر في قنوات السيرفر</p>

    <div class="card">
      <h2>رسالة خاصة</h2>
      <label>الوجهة</label>
      <div class="radio-group">
        <label><input type="radio" name="dmMode" value="all" checked> كل الأعضاء</label>
        <label><input type="radio" name="dmMode" value="role"> رتبة معيّنة</label>
        <label><input type="radio" name="dmMode" value="user"> عضو بعينه</label>
      </div>

      <div id="dmRoleField" style="display:none">
        <label>الرتبة</label>
        <select id="dmRole"></select>
      </div>
      <div id="dmUserField" style="display:none">
        <label>العضو</label>
        <div id="dmUserPicker"></div>
      </div>

      <label>نص الرسالة</label>
      <textarea id="dmContent" placeholder="اكتب الرسالة هنا…"></textarea>
      <button class="btn" id="dmSend">إرسال</button>
      <div class="msg" id="dmMsg"></div>
    </div>

    <div class="card">
      <h2>إعلان في قناة</h2>
      <label>القناة</label>
      <select id="announceChannel"></select>
      <label>نص الإعلان</label>
      <textarea id="announceContent" placeholder="اكتب الإعلان هنا…"></textarea>
      <button class="btn" id="announceSend">نشر الإعلان</button>
      <div class="msg" id="announceMsg"></div>
    </div>

    <div class="footer-credit">تم التطوير عن طريق <a href="https://www.tsh87.com" target="_blank" rel="noopener"><b>vzjRR</b></a></div>
  </main>
</div>
<script src="/js/app.js"></script>
<script src="/js/memberPicker.js"></script>
<script src="/js/formatToolbar.js"></script>
<script src="/js/attachments.js"></script>
<script>
  attachFormatToolbar(document.getElementById('dmContent'));
  attachFormatToolbar(document.getElementById('announceContent'));

  // مرفقات: صور وفيديو وملفات — بالزر أو بالسحب أو باللصق
  const dmFiles = attachUploader(document.getElementById('dmContent'));
  const announceFiles = attachUploader(document.getElementById('announceContent'));

  const dmUserPicker = createMemberPicker({ mount: document.getElementById('dmUserPicker'), mode: 'members' });

  (async () => {
    try {
      const { roles } = await api('GET', '/api/discord/roles');
      document.getElementById('dmRole').innerHTML = roles.map((r) => `<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('');
    } catch { /* الحقل يبقى فاضي لو فشل */ }

    try {
      const { channels } = await api('GET', '/api/discord/channels');
      document.getElementById('announceChannel').innerHTML = channels.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    } catch { /* تجاهل */ }
  })();

  document.querySelectorAll('input[name=dmMode]').forEach((el) => {
    el.addEventListener('change', () => {
      const mode = document.querySelector('input[name=dmMode]:checked').value;
      document.getElementById('dmRoleField').style.display = mode === 'role' ? 'block' : 'none';
      document.getElementById('dmUserField').style.display = mode === 'user' ? 'block' : 'none';
    });
  });

  document.getElementById('dmSend').addEventListener('click', async () => {
    const mode = document.querySelector('input[name=dmMode]:checked').value;
    const content = document.getElementById('dmContent').value.trim();
    const roleId = document.getElementById('dmRole').value;
    const userId = dmUserPicker.getId();
    const msgEl = document.getElementById('dmMsg');
    const btn = document.getElementById('dmSend');
    const files = dmFiles.files();
    if (!content && !files.length) return showMsg(msgEl, 'اكتب نص الرسالة أو أرفق ملفًا', false);
    if (mode === 'user' && !userId) return showMsg(msgEl, 'اختر العضو أولًا', false);

    btn.disabled = true;
    if (files.length) showMsg(msgEl, 'جارٍ رفع المرفقات…', true);
    try {
      const data = await postWithAttachments('/api/messages/dm', { mode, roleId, userId, content }, files);
      showMsg(msgEl, `بدأ الإرسال إلى ${data.targetCount} مستلمًا${data.testMode ? ' (وضع تجربة — حُوّلت جميعها إلى عضو التجربة)' : ''}. تابع النتيجة في سجل النشاط.`, true);
      document.getElementById('dmContent').value = '';
      dmFiles.clear();
    } catch (err) {
      showMsg(msgEl, err.message, false);
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('announceSend').addEventListener('click', async () => {
    const channelId = document.getElementById('announceChannel').value;
    const content = document.getElementById('announceContent').value.trim();
    const msgEl = document.getElementById('announceMsg');
    const btn = document.getElementById('announceSend');
    const files = announceFiles.files();
    if (!content && !files.length) return showMsg(msgEl, 'اكتب نص الإعلان أو أرفق ملفًا', false);

    btn.disabled = true;
    if (files.length) showMsg(msgEl, 'جارٍ رفع المرفقات…', true);
    try {
      const data = await postWithAttachments('/api/messages/announce', { channelId, content }, files);
      showMsg(msgEl, data.testMode ? 'أُرسل (وضع تجربة — ذهب إلى عضو التجربة بدل القناة).' : 'نُشر الإعلان.', true);
      document.getElementById('announceContent').value = '';
      announceFiles.clear();
    } catch (err) {
      showMsg(msgEl, err.message, false);
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
